plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.phantomeye.phantom_eye"
    // maplibre_gl currently requires compileSdk 36 / NDK 28.x — bump past
    // Flutter's own defaults rather than waiting for every plugin to catch up.
    compileSdk = 36
    ndkVersion = "28.1.13356709"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.phantomeye.phantom_eye"
        // Android Auto (androidx.car.app), BLE (Meshtastic) and MapLibre native all need a
        // reasonably modern floor; 24 (Android 7.0) covers ~99% of active devices.
        minSdk = 24
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            ndk {
                abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
            }
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.3"

    // Android Auto (see android/app/src/main/kotlin/.../carapp/).
    implementation "androidx.car.app:app:1.7.0"
    implementation "androidx.car.app:app-projected:1.7.0"
}

flutter {
    source = "../.."
}
