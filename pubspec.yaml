name: phantom_eye
description: "Phantom Eye — photorealistic 3D globe, offline and online."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_inappwebview: ^6.1.5
  flutter_secure_storage: ^10.3.1
  connectivity_plus: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Bundled CesiumJS web map (served locally so the app shell works offline).
  # This list is generated by tool/sync_webmap.sh — re-run it after rebuilding
  # the web bundle so newly added Cesium files are registered.
  assets:
    - assets/webmap/
    - assets/webmap/assets/
    - assets/webmap/cesium/
    - assets/webmap/cesium/Assets/
    - assets/webmap/cesium/Assets/IAU2006_XYS/
    - assets/webmap/cesium/Assets/Images/
    - assets/webmap/cesium/Assets/Textures/
    - assets/webmap/cesium/Assets/Textures/LensFlare/
    - assets/webmap/cesium/Assets/Textures/maki/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/0/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/0/0/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/0/1/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/1/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/1/0/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/1/1/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/1/2/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/1/3/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/0/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/1/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/2/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/3/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/4/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/5/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/6/
    - assets/webmap/cesium/Assets/Textures/NaturalEarthII/2/7/
