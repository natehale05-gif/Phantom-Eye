<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Phantom Eye Map</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        background: #05070c;
      }
      #cesiumContainer {
        position: absolute;
        inset: 0;
      }
      .cesium-widget canvas {
        outline: none;
      }
      .cesium-viewer-bottom {
        display: none !important;
      }
      /* Attribution (required). Kept visible; the native UI leaves room for it. */
      .pe-credits {
        position: absolute;
        left: 12px;
        bottom: 10px;
        z-index: 3;
        font: 11px -apple-system, system-ui, sans-serif;
        color: rgba(255, 255, 255, 0.45);
      }
      .pe-credits a {
        color: rgba(255, 255, 255, 0.6);
        text-decoration: none;
      }
      .pe-credits img {
        max-height: 20px;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <div id="cesiumContainer"></div>
    <div id="peCredits" class="pe-credits"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
