name: Deploy web app to GitHub Pages

# Builds the Phantom Eye web app (Vite + CesiumJS) and publishes it to
# GitHub Pages so it can be tested live in a browser.
#
# One-time setup: in the repository, go to Settings → Pages and set
# "Build and deployment" → Source to "GitHub Actions".

on:
  push:
    branches:
      - cursor/offline-maps-street-names-16d3
      - cursor/photoreal-3d-map-apple-ui-16d3
      - claude/gas-price-tracker-ui1mpd
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer runs cancel in-progress ones.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
