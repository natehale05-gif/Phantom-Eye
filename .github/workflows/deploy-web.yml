name: Deploy web build to GitHub Pages

# Lets you (the maintainer) open the app in a browser to click around
# without needing Xcode/Android Studio. This is a QA build, not a
# substitute for testing the real iOS/Android/CarPlay/Android Auto
# targets — see README.md "Web build caveats" for what doesn't work here
# (Meshtastic BLE pairing needs Web Bluetooth support, which not every
# browser has; CarPlay/Android Auto obviously don't exist on the web at
# all).
on:
  push:
    branches:
      - main
      - "cursor/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6
          cache: true

      - run: flutter pub get

      - name: Build web (base-href = /<repo-name>/)
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
